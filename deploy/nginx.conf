# /etc/nginx/sites-available/terzo  (troque terzo.suaempresa.com.br pelo seu domínio)
server {
    listen 80;
    server_name terzo.suaempresa.com.br;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name terzo.suaempresa.com.br;
    # Certificado (ex.: sudo certbot --nginx -d terzo.suaempresa.com.br)
    ssl_certificate     /etc/letsencrypt/live/terzo.suaempresa.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terzo.suaempresa.com.br/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 30m;           # um pouco acima de MAX_UPLOAD_MB

    location /api/events {               # tempo real (Server-Sent Events): sem buffer, conexão longa
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 75s;
    }
}
