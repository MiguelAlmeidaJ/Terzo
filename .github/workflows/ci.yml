name: CI

on:
  push:
    branches: [main, monorepo]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for original CRM HTML generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo structure
        run: pnpm architecture:check

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Type-check
        run: pnpm typecheck

      - name: Unit and security tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build

      - name: Verify original interface and route permissions
        run: pnpm ui:verify
