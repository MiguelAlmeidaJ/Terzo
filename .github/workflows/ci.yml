name: CI

on:
  push:
    branches: [main, monorepo]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace
        run: pnpm install --no-frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Type-check
        run: pnpm typecheck

      - name: Unit and security tests
        run: pnpm test

      - name: Build monorepo
        run: pnpm build
